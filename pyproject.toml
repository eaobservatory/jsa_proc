[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jsa_proc"
version = "0.0.0"
dependencies = [
    "astropy",
    "docopt",
    "flask",
    "lxml",
    "matplotlib",
    "mysql-connector-python",
    "Pillow",
    "pymoc",
    "requests",
]

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.package-dir]
"" = "lib"
