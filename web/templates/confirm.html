{% extends 'layout.html' %}

{% block content %}
  <p>
    {{ message }}
  </p>

  <form method="POST" {% if target is defined %} action="{{ target }}"{% endif %}>
    <p>
      <input type="submit" name="submit_cancel" value="Cancel" />
      <input type="submit" name="submit_confirm" value="Confirm" />
    </p>
  </form>
{% endblock %}
